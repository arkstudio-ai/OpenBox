# Trajectory trace database migrations; the business chain stays in alembic.ini.
# From backend/: TRAJECTORY_DATABASE_URL=... alembic -c alembic_trajectory.ini upgrade head
# There is deliberately no sqlalchemy.url: env.py only accepts TRAJECTORY_DATABASE_URL.
[alembic]
script_location = trajectory/store/migrations
version_table = trajectory_alembic_version

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
