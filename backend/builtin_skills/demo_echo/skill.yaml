apiVersion: openbox.ai/v1
kind: Skill
metadata:
  name: demo-echo
  version: 1.0.0
  displayName: Demo Echo
spec:
  distribution: builtin
  defaultEnabled: true
  runtime:
    kind: internal
    handler: builtin.demo_echo
    handlerVersion: 1
  operations:
    echo:
      inputSchema:
        type: object
        required: [text]
      queue: default
      invocationTimeoutSeconds: 30
      maxTotalSeconds: 600
      maxAttempts: 3
    slow_echo:
      inputSchema:
        type: object
        required: [text]
      queue: default
      invocationTimeoutSeconds: 30
      maxExternalWaitSeconds: 3600
      maxTotalSeconds: 7200
      maxAttempts: 5
    ask_then_echo:
      inputSchema:
        type: object
      queue: default
      invocationTimeoutSeconds: 30
      userInputTimeoutSeconds: 86400
      maxTotalSeconds: 172800
      maxAttempts: 3
    # The three below exist so the failure paths can be exercised by hand in
    # the UI, not only in tests: a retry backoff to cancel out of, an
    # invocation that must be killed by the operation's own timeout (not the
    # global default), and a prompt-only park that must not offer an answer box.
    fail_then_succeed:
      inputSchema:
        type: object
      queue: default
      invocationTimeoutSeconds: 30
      maxTotalSeconds: 3600
      maxAttempts: 4
    slow_step:
      inputSchema:
        type: object
      queue: default
      #: Deliberately far below the global default (120s): a job killed at 5s
      #: proves the per-operation bound is the one being enforced.
      invocationTimeoutSeconds: 5
      maxTotalSeconds: 600
      maxAttempts: 1
    park_notice:
      inputSchema:
        type: object
      queue: default
      invocationTimeoutSeconds: 30
      userInputTimeoutSeconds: 86400
      maxTotalSeconds: 3600
      maxAttempts: 2
  phases:
    waiting_provider: skill.demo-echo.phase.waiting_provider
    waiting_answer: skill.demo-echo.phase.waiting_answer
    delivering: skill.demo-echo.phase.delivering
