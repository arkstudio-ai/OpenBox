[project]
name = "openbox-backend"
version = "0.1.0"
description = "OpenBox: Sandbox Management + AI Agent Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.23.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.0.0",
    "litellm>=1.40.0",
    # Direct dependency: the built-in image_gen tool uses the canonical
    # multipart handling for /images/edits instead of relying on LiteLLM's
    # transitive OpenAI dependency.
    "openai>=2.21.0",
    "pydantic-ai>=0.1.0",
    "python-ulid>=3.0.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "python-socks[asyncio]>=2.8.1",
    # Multi-user: Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Multi-user: Cache
    "redis[hiredis]>=5.0",
    # Multi-user: Blob Storage
    "azure-storage-blob>=12.0",
    # Multi-user: Auth
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "croniter>=6.0.0",
    # Optional GCS blob storage (Agent execution itself is WUYING-only)
    "google-cloud-storage>=2.14.0",
    # Wuying cloud-desktop view (ECD GetConnectionTicket)
    "alibabacloud-ecd20200930>=4.0.0",
    # Stay off the 0.4.0 release candidates: they read `provider_name` off the
    # credential object while still declaring credentials>=0.3.6, which has no
    # such field. Resolving one breaks every WUYING API call — the cloud
    # desktop stops connecting with a 502 from /api/desktop/ticket.
    "alibabacloud-tea-openapi>=0.3.16,<0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "agent", "api", "blob", "bus", "command", "core", "mcp",
    "models", "permission", "project", "question", "sandbox",
    "session", "skill", "snapshot", "storage", "tool",
    "db", "cache", "auth", "video",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
