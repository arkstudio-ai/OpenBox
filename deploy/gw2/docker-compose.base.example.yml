# Sanitized example of the production base compose file, /opt/openbox/docker-compose.yml.
#
# The real file exists only on the servers (docs/DEPLOY.md "四、已知问题 1"). This copy is
# reconstructed from docs/DEPLOY.md ("二、服务器目录与配置文件") and
# docs/trajectory-rearch/maps/infra.full.md section 4 so that docker-compose.trajectory.yml can
# be validated with `docker compose config` (RUNBOOK.md, "Validate the compose files"). Secrets
# come from .env and config/backend.env; the values here are placeholders. Details the
# documentation does not record are marked "assumption": compare them with the server's file
# before a release.

services:
  backend:
    image: openbox-backend:${OPENBOX_IMAGE_TAG}
    env_file:
      - config/backend.env
    # Compose environment overrides the env file for these keys (docs/DEPLOY.md).
    environment:
      DATABASE_URL: postgresql+asyncpg://openbox:${OPENBOX_DB_PASSWORD}@postgres:5432/openbox
      REDIS_URL: redis://redis:6379/0
      WUYING_ENDPOINT: http://host.docker.internal:18001
      LOGTO_REDIRECT_URI: https://ai.example.invalid/callback
      LOGTO_POST_LOGOUT_REDIRECT_URI: https://ai.example.invalid
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./config/openbox.json:/app/openbox.json:ro
      - ./secrets:/run/secrets:ro
      # Assumption: the legacy trajectory blob store is local (BLOB_LOCAL_PATH default).
      - blob-data:/opt/openbox/blobs
    depends_on:
      - postgres
      - redis
    # Assumption: the documented "healthy" state comes from a curl check of /health.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: openbox-frontend-v2:${OPENBOX_IMAGE_TAG}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  postgres:
    # Assumption: the production image version is not recorded in the repository.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openbox
      POSTGRES_PASSWORD: ${OPENBOX_DB_PASSWORD}
      POSTGRES_DB: openbox
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbox -d openbox"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  blob-data:
