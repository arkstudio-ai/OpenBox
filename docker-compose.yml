services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/openbox.json:/app/openbox.json:ro
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DEBUG=true
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://openbox:openbox@postgres:5432/openbox}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  # Skill job worker role: same image and code as the web role, different
  # process (rebuild plan §4.3). Claims and executes durable skill jobs so a
  # web restart or rolling deploy never kills running work. No migrations
  # here — the web role's CMD owns `alembic upgrade head`.
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "skill_runtime.worker_main"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/openbox.json:/app/openbox.json:ro
    env_file:
      - ./backend/.env
    environment:
      # Only the Compose-internal service addresses override backend/.env.
      # Provider, JWT, OSS and video credentials must stay identical to the API
      # role; spelling them here with `${VAR:-}` would replace env_file values
      # with empty/default strings during Compose interpolation.
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://openbox:openbox@postgres:5432/openbox}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SKILL_WORKER_QUEUES=${SKILL_WORKER_QUEUES:-default}
    depends_on:
      - redis
      - backend
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=openbox
      - POSTGRES_PASSWORD=openbox
      - POSTGRES_DB=openbox
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
