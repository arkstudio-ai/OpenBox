<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAgent Browser</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="popup">
      <h1>OpenAgent Browser</h1>

      <!-- Auth Status -->
      <div class="auth-section">
        <p id="auth-status" class="auth-status checking">Checking login...</p>
      </div>

      <hr class="divider" />

      <!-- Toggle -->
      <div class="toggle-row">
        <label class="toggle">
          <input type="checkbox" id="active-toggle" />
          <span class="slider"></span>
        </label>
        <span id="status-text">Inactive</span>
      </div>
      <p id="connection-status" class="connection-status"></p>

      <!-- Client ID (readonly info) -->
      <p id="client-id-info" class="config-status" style="font-size:10px;opacity:0.5;margin-top:8px"></p>

      <!-- Advanced: point the extension at a different OpenBox instance -->
      <details class="advanced">
        <summary>Advanced</summary>
        <label class="field-label" for="server-url">Server URL</label>
        <input
          type="text"
          id="server-url"
          class="field-input"
          spellcheck="false"
          autocomplete="off"
          placeholder="http://localhost:3000"
        />
        <div class="field-actions">
          <button type="button" id="save-server-url" class="btn btn-primary">Save</button>
          <button type="button" id="reset-server-url" class="btn">Reset</button>
        </div>
        <p id="server-url-status" class="field-status"></p>
        <p class="field-hint">
          The origin you sign in to. Changing it reconnects the relay.
        </p>
      </details>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
