server {
    listen 80;
    server_name localhost;
    client_max_body_size 1g;
    root /usr/share/nginx/html;
    index index.html;

    # Docker may give a recreated backend a new IP. Re-resolve it without
    # requiring a frontend restart; API/WS paths and query strings stay intact.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $backend_upstream http://${BACKEND_HOST};

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # A missing old deployment chunk is not an SPA route. Returning index.html
    # with status 200 causes the browser's strict module MIME error.
    location ^~ /assets/ {
        try_files $uri @missing_asset;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location @missing_asset {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 404 "Asset not found\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
