# The image's `main` access log format, field for field, followed by the
# request time and the upstream response time. Existing fields keep their
# positions, so the client IP from X-Forwarded-For stays the last quoted field.
# This template is included in the http context, where log_format belongs.
log_format openbox_timing '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"'
                          ' rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name localhost;
    client_max_body_size 1g;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log openbox_timing;

    # A chat's JSON history is about five times smaller compressed (1.24 MB to
    # 254 KB for a 350-message conversation). gzip_proxied lets /api responses
    # qualify; text/event-stream is left out so streams are never buffered.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Docker may give a recreated backend a new IP. Re-resolve it without
    # requiring a frontend restart; API/WS paths and query strings stay intact.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $backend_upstream http://${BACKEND_HOST};
    # Admin trajectory reads, their socket tickets and the watermark socket are
    # served by the trajectory worker. The image defaults TRAJECTORY_HOST to the
    # backend, so a frontend started without it keeps the single-upstream routing.
    set $trajectory_upstream http://${TRAJECTORY_HOST};

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # A missing old deployment chunk is not an SPA route. Returning index.html
    # with status 200 causes the browser's strict module MIME error.
    location ^~ /assets/ {
        try_files $uri @missing_asset;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location @missing_asset {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 404 "Asset not found\n";
    }

    location = /landing {
        try_files /landing.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # More specific than /api/ and /ws/ below, so these win for their paths.
    location ^~ /api/admin/trajectories/ {
        proxy_pass $trajectory_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A viewer socket can stay quiet between watermarks; keep it open well past
    # nginx's 60 s idle default (the worker also pings every 20 s).
    location = /ws/admin/trajectories {
        proxy_pass $trajectory_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Internal endpoints serve host scripts, which call the backend on
    # 127.0.0.1:8080 directly. The public proxy never forwards them.
    location = /api/internal {
        return 404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public harness API for API-key clients (backend sub-application at /v1).
    # Without this the SPA fallback answers /v1/* with index.html and 200.
    # Uploads to /v1/files are streamed through rather than spooled: the
    # backend enforces its own 200 MB ceiling as the bytes arrive.
    location /v1/ {
        proxy_pass $backend_upstream;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
