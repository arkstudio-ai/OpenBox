---
apiVersion: v1
kind: Namespace
metadata:
  name: openbox

---
apiVersion: v1
kind: Namespace
metadata:
  name: openbox-sandbox

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbox-backend
  namespace: openbox

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-pods
  namespace: openbox-sandbox

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: openbox-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-sandbox-manager
  namespace: openbox-sandbox
subjects:
  - kind: ServiceAccount
    name: openbox-backend
    namespace: openbox
roleRef:
  kind: Role
  name: sandbox-manager
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: sandbox-priority
value: 100000
globalDefault: false
description: "Priority class for OpenBox sandbox pods"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbox-config
  namespace: openbox
data:
  SANDBOX_PROVIDER: "kubernetes"
  K8S_NAMESPACE: "openbox-sandbox"
  K8S_SANDBOX_SERVICE_ACCOUNT: "sandbox-pods"
  K8S_STORAGE_CLASS: "managed-csi"
  K8S_STORAGE_SIZE: "10Gi"
  K8S_SANDBOX_CPU_REQUEST: "250m"
  K8S_SANDBOX_CPU_LIMIT: "1000m"
  K8S_SANDBOX_MEMORY_REQUEST: "256Mi"
  K8S_SANDBOX_MEMORY_LIMIT: "1Gi"
  BLOB_PROVIDER: "azure"
  BLOB_AZURE_CONTAINER: "ads-staging"
  MAX_CONCURRENT_AGENTS: "1"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbox-backend
  namespace: openbox
  labels:
    app: openbox-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbox-backend
  template:
    metadata:
      labels:
        app: openbox-backend
    spec:
      serviceAccountName: openbox-backend
      containers:
        - name: backend
          image: YOUR_ACR_NAME.azurecr.io/openbox-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: openbox-config
            - secretRef:
                name: openbox-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: openbox-backend
  namespace: openbox
spec:
  type: ClusterIP
  selector:
    app: openbox-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbox-frontend
  namespace: openbox
  labels:
    app: openbox-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbox-frontend
  template:
    metadata:
      labels:
        app: openbox-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_ACR_NAME.azurecr.io/openbox-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: openbox-frontend
  namespace: openbox
spec:
  type: ClusterIP
  selector:
    app: openbox-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbox-ingress
  namespace: openbox
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: openbox-backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: openbox-backend
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: openbox-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbox-frontend
                port:
                  number: 80
