# Legacy GKE manifest: frozen, not the production path (README.md). The trajectory worker sidecar,
# its Service and the admin trajectory ingress paths (SPEC §12) are untested.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openbox-sandbox

---
apiVersion: v1
kind: Namespace
metadata:
  name: openbox

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbox-backend
  namespace: openbox
  annotations:
    iam.gke.io/gcp-service-account: openbox-backend@PROJECT_ID.iam.gserviceaccount.com

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-pods
  namespace: openbox-sandbox
  annotations:
    iam.gke.io/gcp-service-account: openbox-sandbox@PROJECT_ID.iam.gserviceaccount.com

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: openbox-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-sandbox-manager
  namespace: openbox-sandbox
subjects:
  - kind: ServiceAccount
    name: openbox-backend
    namespace: openbox
roleRef:
  kind: Role
  name: sandbox-manager
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: sandbox-priority
value: 100000
globalDefault: false
description: "Priority class for OpenBox sandbox pods"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbox-backend
  namespace: openbox
  labels:
    app: openbox-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbox-backend
  template:
    metadata:
      labels:
        app: openbox-backend
    spec:
      serviceAccountName: openbox-backend
      # Time for the trajectory-worker sidecar to ingest the last spool files.
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: gcr.io/PROJECT_ID/openbox-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SANDBOX_PROVIDER
              value: "kubernetes"
            - name: K8S_NAMESPACE
              value: "openbox-sandbox"
            - name: K8S_SANDBOX_SERVICE_ACCOUNT
              value: "sandbox-pods"
            - name: SANDBOX_IMAGE
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: SANDBOX_IMAGE
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: JWT_SECRET
            - name: BLOB_PROVIDER
              value: "azure"
            - name: BLOB_AZURE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: BLOB_AZURE_CONNECTION_STRING
            - name: BLOB_AZURE_CONTAINER
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: BLOB_AZURE_CONTAINER
            - name: OPENBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: OPENBOX_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: OPENAI_API_KEY
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: OPENAI_BASE_URL
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: TAVILY_API_KEY
            - name: MAX_CONCURRENT_AGENTS
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: MAX_CONCURRENT_AGENTS
            # Trajectory events go to the spool shared with the trajectory-worker sidecar.
            - name: TRAJECTORY_SINK
              value: "spool"
            - name: TRAJECTORY_WORKER_MODE
              value: "external"
            - name: TRAJECTORY_SPOOL_DIR
              value: "/var/lib/openbox/trajectory-spool"
            # Guards the internal endpoints the worker calls (viewer introspection, audit).
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: INTERNAL_API_TOKEN
                  optional: true
          volumeMounts:
            - name: trajectory-spool
              mountPath: /var/lib/openbox/trajectory-spool
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
        # Same image as the backend; one pod, one writer. Never call it openbox-backend-worker:
        # `make k8s-apply` deletes the Deployment of that name.
        # No readiness or liveness probe: a pod is Ready only while all of its containers are, and a
        # NotReady pod also leaves the openbox-backend Service, so a probe here would let the worker or
        # the trace database take the business API down. For the same reason the command retries the
        # trace migrations instead of exiting. The load balancer checks the worker's /health through
        # the openbox-trajectory-worker-config BackendConfig. A worker process that exits still
        # restarts inside the pod and makes it NotReady for a moment; only a separate Deployment
        # avoids that.
        - name: trajectory-worker
          image: gcr.io/PROJECT_ID/openbox-backend:latest
          command:
            - /bin/sh
            - -ec
            - |
              until alembic -c alembic_trajectory.ini upgrade head; do
                echo "trace database migrations failed; retrying in 30 s" >&2
                sleep 30
              done
              exec python -m trajectory.worker
          ports:
            - containerPort: 8090
          env:
            - name: TRAJECTORY_WORKER_MODE
              value: "external"
            - name: TRAJECTORY_SPOOL_DIR
              value: "/var/lib/openbox/trajectory-spool"
            # No OSS here: blobs live in the pod until a persistent volume backs this path.
            - name: TRAJECTORY_BLOB_PROVIDER
              value: "local"
            - name: TRAJECTORY_BLOB_LOCAL_PATH
              value: "/var/lib/openbox/trajectory-blobs"
            - name: TRAJECTORY_BACKEND_INTERNAL_URL
              value: "http://127.0.0.1:8080"
            # postgresql+asyncpg://openbox_trace:<password>@<host>:5432/openbox_trace: the dedicated
            # openbox_trace role (deploy/gw2/scripts/create-trace-db.sh), never the business database user.
            - name: TRAJECTORY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: TRAJECTORY_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbox-secrets
                  key: INTERNAL_API_TOKEN
                  optional: true
          volumeMounts:
            - name: trajectory-spool
              mountPath: /var/lib/openbox/trajectory-spool
            - name: trajectory-blobs
              mountPath: /var/lib/openbox/trajectory-blobs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        # Pod-local: spool files the worker has not ingested yet are lost with the pod.
        - name: trajectory-spool
          emptyDir: {}
        - name: trajectory-blobs
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: openbox-backend
  namespace: openbox
spec:
  type: ClusterIP
  selector:
    app: openbox-backend
  ports:
    - port: 8080
      targetPort: 8080

---
# Admin trajectory HTTP API and WebSocket served by the trajectory-worker sidecar.
apiVersion: v1
kind: Service
metadata:
  name: openbox-trajectory-worker
  namespace: openbox
  annotations:
    cloud.google.com/backend-config: '{"default": "openbox-trajectory-worker-config"}'
spec:
  type: ClusterIP
  selector:
    app: openbox-backend
  ports:
    - port: 8090
      targetPort: 8090

---
# Load balancer settings of the worker: the WebSocket timeout of openbox-backend-config and an explicit
# health check, because the sidecar has no readiness probe for GKE to derive one from.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: openbox-trajectory-worker-config
  namespace: openbox
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    type: HTTP
    requestPath: /health
    port: 8090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbox-frontend
  namespace: openbox
  labels:
    app: openbox-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbox-frontend
  template:
    metadata:
      labels:
        app: openbox-frontend
    spec:
      containers:
        - name: frontend
          image: gcr.io/PROJECT_ID/openbox-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: openbox-frontend
  namespace: openbox
spec:
  type: ClusterIP
  selector:
    app: openbox-frontend
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: openbox-backend-config
  namespace: openbox
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60

---
apiVersion: v1
kind: Service
metadata:
  name: openbox-backend-ws
  namespace: openbox
  annotations:
    cloud.google.com/backend-config: '{"default": "openbox-backend-config"}'
spec:
  type: ClusterIP
  selector:
    app: openbox-backend
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbox-ingress
  namespace: openbox
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          # The longest prefix wins: admin trajectory routes go to the worker sidecar.
          - path: /api/admin/trajectories
            pathType: Prefix
            backend:
              service:
                name: openbox-trajectory-worker
                port:
                  number: 8090
          - path: /ws/admin/trajectories
            pathType: Prefix
            backend:
              service:
                name: openbox-trajectory-worker
                port:
                  number: 8090
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: openbox-backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: openbox-backend-ws
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: openbox-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbox-frontend
                port:
                  number: 80
