# Bossip mobile analysis options.
#
# Mirrors frontend-v2's gate philosophy (tsc --strict + eslint):
# strict type checks on, plus style/consistency lints beyond flutter_lints.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Upstream source kept byte-identical on purpose (only its Gradle script is
    # ours). Linting it to our house style would mean editing it, which is the
    # one thing the vendoring exists to avoid.
    - third_party/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    dead_code: error
    invalid_use_of_protected_member: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_super_parameters
